[package]
name = "rasdaw"
version = "0.1.0"
edition = "2021"
authors = ["Beat Weber <beat.weber@bithawk.ch>"]
description = "RasDaw by Fonsie Audio: Bitwig-inspired DAW framework with CLAP plugin hosting"

[dependencies]
eframe = { version = "0.31", default-features = false, features = ["glow", "x11", "wayland", "default_fonts"] }
clap-sys = "0.5"
libloading = "0.8"
x11rb = "0.13"
rtrb = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
strip = "symbols"

# Release build with debug info, for profiling: cargo build --profile profiling
[profile.profiling]
inherits = "release"
debug = 1
strip = "none"

[profile.dev]
opt-level = 1
